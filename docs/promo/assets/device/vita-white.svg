<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1820 880" width="1820" height="880">
  <!-- Original front-view drawing of a white handheld (182.0 x 83.5 mm body, 5" 960x544 screen).
       Drawn from scratch from published dimensions; units = 0.1 mm. No logos or trademarks. -->
  <defs>
    <!-- body -->
    <path id="outline" d="M330,45 H1490 C1734.2,45 1820,153.55 1820,462.5 C1820,771.45 1734.2,880 1490,880 H330 C85.8,880 0,771.45 0,462.5 C0,153.55 85.8,45 330,45 Z"/>
    <clipPath id="body-clip"><use href="#outline"/></clipPath>
    <linearGradient id="g-body" x1="0" y1="45" x2="0" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdfdfe"/>
      <stop offset="0.45" stop-color="#f6f7f9"/>
      <stop offset="1" stop-color="#e8eaee"/>
    </linearGradient>
    <linearGradient id="g-rim" x1="0" y1="45" x2="0" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d5d9df"/>
      <stop offset="1" stop-color="#a8aeb7"/>
    </linearGradient>
    <linearGradient id="g-rim-hi" x1="0" y1="45" x2="0" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="f-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="f-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <!-- shoulders -->
    <linearGradient id="g-shoulder" x1="0" y1="18" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1f3f5"/>
      <stop offset="0.5" stop-color="#e4e7eb"/>
      <stop offset="1" stop-color="#cdd2d8"/>
    </linearGradient>

    <!-- glass -->
    <linearGradient id="g-gloss" x1="325" y1="112" x2="1100" y2="813" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.43" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-glass-edge" x1="0" y1="112" x2="0" y2="813" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="1" stop-color="#15181c"/>
    </linearGradient>
    <radialGradient id="g-lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4a5a78"/>
      <stop offset="0.35" stop-color="#1a2130"/>
      <stop offset="1" stop-color="#05070a"/>
    </radialGradient>

    <!-- buttons -->
    <linearGradient id="g-well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bec6"/>
      <stop offset="1" stop-color="#e2e5e9"/>
    </linearGradient>
    <radialGradient id="g-cap" cx="0.42" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#d9dde2"/>
    </radialGradient>
    <linearGradient id="g-cap-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b4bac3"/>
    </linearGradient>
    <linearGradient id="g-dpad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e6ea"/>
    </linearGradient>
    <linearGradient id="g-cross-well" x1="0" y1="241" x2="0" y2="389" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfc4cb"/>
      <stop offset="1" stop-color="#dde0e5"/>
    </linearGradient>
    <radialGradient id="g-hub" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2a2e34"/>
      <stop offset="1" stop-color="#555b64"/>
    </radialGradient>

    <!-- sticks -->
    <radialGradient id="g-stick-well" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0.7" stop-color="#0f1114"/>
      <stop offset="0.9" stop-color="#2b2f35"/>
      <stop offset="1" stop-color="#6d737c"/>
    </radialGradient>
    <linearGradient id="g-stick-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="0.55" stop-color="#d6dade"/>
      <stop offset="1" stop-color="#a9afb7"/>
    </linearGradient>
    <linearGradient id="g-stick-dish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8bdc4"/>
      <stop offset="0.5" stop-color="#d3d7dc"/>
      <stop offset="1" stop-color="#eceef1"/>
    </linearGradient>
    <radialGradient id="g-stick-centre" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <g id="grille-row">
      <circle cx="-28" cy="0" r="3.3"/><circle cx="-14" cy="0" r="3.3"/><circle cx="0" cy="0" r="3.3"/><circle cx="14" cy="0" r="3.3"/><circle cx="28" cy="0" r="3.3"/>
    </g>
  </defs>

  <!-- ===== shoulder buttons (behind the body) ===== -->
  <g id="btn-l">
    <path d="M430,62 V40 Q430,20 410,20 H330 C180,20 95,85 64.4,150.1 L90,160 C122,95 200,62 330,62 Z" fill="url(#g-shoulder)" stroke="#c3c8cf" stroke-width="1.5"/>
    <path d="M80,128 C124,72 205,47 330,46 H426" fill="none" stroke="#9ea4ad" stroke-width="5" stroke-opacity="0.55"/>
    <path d="M110,90 C160,45 220,24 330,23.5 H408" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8" stroke-linecap="round"/>
    <path class="glow" d="M430,62 V40 Q430,20 410,20 H330 C180,20 95,85 64.4,150.1 L90,160 C122,95 200,62 330,62 Z" fill="#5bdccf" opacity="0"/>
  </g>
  <g id="btn-r">
    <path d="M1390,62 V40 Q1390,20 1410,20 H1490 C1640,20 1725,85 1755.6,150.1 L1730,160 C1698,95 1620,62 1490,62 Z" fill="url(#g-shoulder)" stroke="#c3c8cf" stroke-width="1.5"/>
    <path d="M1740,128 C1696,72 1615,47 1490,46 H1394" fill="none" stroke="#9ea4ad" stroke-width="5" stroke-opacity="0.55"/>
    <path d="M1710,90 C1660,45 1600,24 1490,23.5 H1412" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8" stroke-linecap="round"/>
    <path class="glow" d="M1390,62 V40 Q1390,20 1410,20 H1490 C1640,20 1725,85 1755.6,150.1 L1730,160 C1698,95 1620,62 1490,62 Z" fill="#5bdccf" opacity="0"/>
  </g>

  <!-- ===== body ===== -->
  <g id="body">
    <use href="#outline" fill="url(#g-body)"/>
    <g clip-path="url(#body-clip)">
      <!-- darker shading toward the outer edge -->
      <use href="#outline" fill="none" stroke="#9aa2ad" stroke-width="80" stroke-opacity="0.5" filter="url(#f-soft)"/>
      <!-- soft top highlight -->
      <ellipse cx="910" cy="70" rx="760" ry="40" fill="#ffffff" opacity="0.7" filter="url(#f-soft)"/>
      <!-- bevel highlight just inside the rim -->
      <use href="#outline" fill="none" stroke="url(#g-rim-hi)" stroke-width="10"/>
    </g>
    <!-- chrome rim -->
    <use href="#outline" fill="none" stroke="url(#g-rim)" stroke-width="3"/>
  </g>

  <!-- ===== glass and screen ===== -->
  <g id="glass-panel">
    <rect x="322.5" y="109.5" width="1175" height="706" rx="32.5" fill="none" stroke="#c4c9d0" stroke-width="2"/>
    <rect id="glass" x="325" y="112" width="1170" height="701" rx="30" fill="#0b0d10"/>
    <rect x="325" y="112" width="1170" height="701" rx="30" fill="url(#g-gloss)"/>
    <rect x="326" y="113" width="1168" height="699" rx="29" fill="none" stroke="url(#g-glass-edge)" stroke-width="2"/>
    <rect x="355.5" y="147.5" width="1109" height="630" fill="none" stroke="#1a1d22" stroke-width="1.5"/>
    <rect id="screen-rect" x="357" y="149" width="1106" height="627" fill="#000"/>
    <!-- front camera -->
    <circle cx="1440" cy="130" r="12" fill="#1b1f25"/>
    <circle id="camera" cx="1440" cy="130" r="9" fill="url(#g-lens)"/>
    <circle cx="1437" cy="127" r="2.2" fill="#9fb4d8" opacity="0.55"/>
  </g>

  <!-- ===== left wing ===== -->
  <g id="dpad" transform="translate(185 315) scale(1.6) translate(-170 -315)">
    <rect x="131" y="241" width="78" height="148" rx="18" fill="url(#g-cross-well)"/>
    <rect x="96" y="276" width="148" height="78" rx="18" fill="url(#g-cross-well)"/>
    <circle cx="170" cy="315" r="17" fill="url(#g-hub)"/>
    <g fill="#8a919b" opacity="0.5" filter="url(#f-shadow)">
      <path d="M164,303 Q170,309 176,303 L203,276 V261 Q203,249 191,249 H149 Q137,249 137,261 V276 Z"/>
      <path d="M164,331 Q170,325 176,331 L203,358 V373 Q203,385 191,385 H149 Q137,385 137,373 V358 Z"/>
      <path d="M156,311 Q162,317 156,323 L129,350 H114 Q102,350 102,338 V296 Q102,284 114,284 H129 Z"/>
      <path d="M184,311 Q178,317 184,323 L211,350 H226 Q238,350 238,338 V296 Q238,284 226,284 H211 Z"/>
    </g>
    <g id="dpad-up">
      <path d="M164,301 Q170,307 176,301 L203,274 V259 Q203,247 191,247 H149 Q137,247 137,259 V274 Z" fill="url(#g-dpad)" stroke="url(#g-cap-edge)" stroke-width="1.8"/>
      <path d="M170,264 L179,279 H161 Z" fill="#b3b9c2" stroke="#ffffff" stroke-width="1" stroke-opacity="0.9"/>
      <path class="glow" d="M164,301 Q170,307 176,301 L203,274 V259 Q203,247 191,247 H149 Q137,247 137,259 V274 Z" fill="#5bdccf" opacity="0"/>
    </g>
    <g id="dpad-down">
      <path d="M164,329 Q170,323 176,329 L203,356 V371 Q203,383 191,383 H149 Q137,383 137,371 V356 Z" fill="url(#g-dpad)" stroke="url(#g-cap-edge)" stroke-width="1.8"/>
      <path d="M170,366 L179,351 H161 Z" fill="#b3b9c2" stroke="#ffffff" stroke-width="1" stroke-opacity="0.9"/>
      <path class="glow" d="M164,329 Q170,323 176,329 L203,356 V371 Q203,383 191,383 H149 Q137,383 137,371 V356 Z" fill="#5bdccf" opacity="0"/>
    </g>
    <g id="dpad-left">
      <path d="M156,309 Q162,315 156,321 L129,348 H114 Q102,348 102,336 V294 Q102,282 114,282 H129 Z" fill="url(#g-dpad)" stroke="url(#g-cap-edge)" stroke-width="1.8"/>
      <path d="M118,315 L133,306 V324 Z" fill="#b3b9c2" stroke="#ffffff" stroke-width="1" stroke-opacity="0.9"/>
      <path class="glow" d="M156,309 Q162,315 156,321 L129,348 H114 Q102,348 102,336 V294 Q102,282 114,282 H129 Z" fill="#5bdccf" opacity="0"/>
    </g>
    <g id="dpad-right">
      <path d="M184,309 Q178,315 184,321 L211,348 H226 Q238,348 238,336 V294 Q238,282 226,282 H211 Z" fill="url(#g-dpad)" stroke="url(#g-cap-edge)" stroke-width="1.8"/>
      <path d="M222,315 L207,306 V324 Z" fill="#b3b9c2" stroke="#ffffff" stroke-width="1" stroke-opacity="0.9"/>
      <path class="glow" d="M184,309 Q178,315 184,321 L211,348 H226 Q238,348 238,336 V294 Q238,282 226,282 H211 Z" fill="#5bdccf" opacity="0"/>
    </g>
  </g>

  <g id="stick-l">
    <circle cx="250" cy="590" r="72.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9"/>
    <circle cx="250" cy="590" r="71" fill="url(#g-stick-well)"/>
    <circle cx="252" cy="596" r="60" fill="#000" opacity="0.55" filter="url(#f-shadow)"/>
    <g id="stick-l-cap">
      <circle cx="250" cy="590" r="60" fill="url(#g-stick-rim)"/>
      <circle cx="250" cy="590" r="56" fill="none" stroke="#8d949d" stroke-width="6" stroke-dasharray="2 2.4" stroke-opacity="0.45"/>
      <circle cx="250" cy="590" r="51" fill="url(#g-stick-dish)" stroke="#aeb4bc" stroke-width="1.2"/>
      <circle cx="250" cy="590" r="51" fill="url(#g-stick-centre)"/>
      <circle class="glow" cx="250" cy="590" r="60" fill="#5bdccf" opacity="0"/>
    </g>
  </g>

  <g id="btn-ps">
    <circle cx="150" cy="745" r="38" fill="url(#g-well)"/>
    <circle cx="150" cy="745" r="34" fill="url(#g-cap)" stroke="url(#g-cap-edge)" stroke-width="1.5"/>
    <circle cx="150" cy="745" r="24" fill="none" stroke="#c9ced5" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle class="glow" cx="150" cy="745" r="34" fill="#5bdccf" opacity="0"/>
  </g>

  <g id="grille-l" fill="#7c838d">
    <use href="#grille-row" x="285" y="823"/>
    <use href="#grille-row" x="285" y="835"/>
    <use href="#grille-row" x="285" y="847"/>
  </g>

  <!-- ===== right wing ===== -->
  <g id="face-buttons">
    <g fill="#8a919b" opacity="0.45" filter="url(#f-shadow)">
      <circle cx="1650" cy="222" r="39"/><circle cx="1745" cy="317" r="39"/>
      <circle cx="1650" cy="412" r="39"/><circle cx="1555" cy="317" r="39"/>
    </g>
    <g id="btn-triangle">
      <circle cx="1650" cy="220" r="44" fill="url(#g-well)"/>
      <circle cx="1650" cy="220" r="39" fill="url(#g-cap)" stroke="url(#g-cap-edge)" stroke-width="1.5"/>
      <path d="M1650,203 L1667.5,233 H1632.5 Z" fill="none" stroke="#8f96a0" stroke-width="3.5" stroke-linejoin="round"/>
      <circle class="glow" cx="1650" cy="220" r="39" fill="#5bdccf" opacity="0"/>
    </g>
    <g id="btn-circle">
      <circle cx="1745" cy="315" r="44" fill="url(#g-well)"/>
      <circle cx="1745" cy="315" r="39" fill="url(#g-cap)" stroke="url(#g-cap-edge)" stroke-width="1.5"/>
      <circle cx="1745" cy="315" r="15" fill="none" stroke="#8f96a0" stroke-width="3.5"/>
      <circle class="glow" cx="1745" cy="315" r="39" fill="#5bdccf" opacity="0"/>
    </g>
    <g id="btn-cross">
      <circle cx="1650" cy="410" r="44" fill="url(#g-well)"/>
      <circle cx="1650" cy="410" r="39" fill="url(#g-cap)" stroke="url(#g-cap-edge)" stroke-width="1.5"/>
      <path d="M1638,398 L1662,422 M1662,398 L1638,422" fill="none" stroke="#8f96a0" stroke-width="3.5" stroke-linecap="round"/>
      <circle class="glow" cx="1650" cy="410" r="39" fill="#5bdccf" opacity="0"/>
    </g>
    <g id="btn-square">
      <circle cx="1555" cy="315" r="44" fill="url(#g-well)"/>
      <circle cx="1555" cy="315" r="39" fill="url(#g-cap)" stroke="url(#g-cap-edge)" stroke-width="1.5"/>
      <rect x="1541.5" y="301.5" width="27" height="27" rx="1.5" fill="none" stroke="#8f96a0" stroke-width="3.5"/>
      <circle class="glow" cx="1555" cy="315" r="39" fill="#5bdccf" opacity="0"/>
    </g>
  </g>

  <g id="stick-r">
    <circle cx="1570" cy="590" r="72.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9"/>
    <circle cx="1570" cy="590" r="71" fill="url(#g-stick-well)"/>
    <circle cx="1572" cy="596" r="60" fill="#000" opacity="0.55" filter="url(#f-shadow)"/>
    <g id="stick-r-cap">
      <circle cx="1570" cy="590" r="60" fill="url(#g-stick-rim)"/>
      <circle cx="1570" cy="590" r="56" fill="none" stroke="#8d949d" stroke-width="6" stroke-dasharray="2 2.4" stroke-opacity="0.45"/>
      <circle cx="1570" cy="590" r="51" fill="url(#g-stick-dish)" stroke="#aeb4bc" stroke-width="1.2"/>
      <circle cx="1570" cy="590" r="51" fill="url(#g-stick-centre)"/>
      <circle class="glow" cx="1570" cy="590" r="60" fill="#5bdccf" opacity="0"/>
    </g>
  </g>

  <g id="btn-select">
    <rect x="1555" y="744" width="70" height="32" rx="16" fill="url(#g-well)"/>
    <rect x="1558" y="747" width="64" height="26" rx="13" fill="url(#g-cap)" stroke="url(#g-cap-edge)" stroke-width="1.2"/>
    <rect class="glow" x="1558" y="747" width="64" height="26" rx="13" fill="#5bdccf" opacity="0"/>
  </g>
  <g id="btn-start">
    <rect x="1655" y="744" width="70" height="32" rx="16" fill="url(#g-well)"/>
    <rect x="1658" y="747" width="64" height="26" rx="13" fill="url(#g-cap)" stroke="url(#g-cap-edge)" stroke-width="1.2"/>
    <rect class="glow" x="1658" y="747" width="64" height="26" rx="13" fill="#5bdccf" opacity="0"/>
  </g>
  <g id="labels" fill="#9aa1ab" font-family="'Promo Sans', sans-serif" font-size="17" letter-spacing="1" text-anchor="middle">
    <text x="1590.5" y="800">SELECT</text>
    <text x="1690.5" y="800">START</text>
  </g>

  <g id="grille-r" fill="#7c838d">
    <use href="#grille-row" x="1535" y="823"/>
    <use href="#grille-row" x="1535" y="835"/>
    <use href="#grille-row" x="1535" y="847"/>
  </g>
  <circle id="mic" cx="910" cy="852" r="3" fill="#7c838d"/>
</svg>
