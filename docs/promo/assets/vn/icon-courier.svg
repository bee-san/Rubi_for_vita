<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<!-- Fictional game icon, original art drawn from scratch for bee-san/vita-jp-overlay. GPL-3.0-only. -->
<!-- Sky Courier: a paper plane over clouds -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3aa2ff"/><stop offset="0.7" stop-color="#9fd8ff"/><stop offset="1" stop-color="#ffe2b8"/>
  </linearGradient>
  <radialGradient id="sun" cx="30" cy="30" r="30" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff7d6" stop-opacity="0.95"/><stop offset="0.3" stop-color="#fff7d6" stop-opacity="0.5"/><stop offset="1" stop-color="#fff7d6" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="128" height="128" fill="url(#bg)"/>
<circle cx="30" cy="30" r="30" fill="url(#sun)"/>
<!-- clouds -->
<g fill="#ffffff">
  <circle cx="20" cy="104" r="16"/><circle cx="42" cy="96" r="18"/><circle cx="66" cy="102" r="16"/>
  <circle cx="90" cy="94" r="18"/><circle cx="112" cy="102" r="16"/><rect x="0" y="104" width="128" height="24"/>
</g>
<g fill="#e3f1ff"><circle cx="30" cy="116" r="12"/><circle cx="76" cy="116" r="13"/><circle cx="110" cy="118" r="12"/></g>
<g transform="translate(60 62) scale(1.08) translate(-64 -56)">
<!-- dashed trail -->
<path d="M44 70C34 78 28 84 30 92" stroke="#ffffff" stroke-width="2.6" stroke-dasharray="5 4" stroke-linecap="round" fill="none"/>
<!-- paper plane -->
<path d="M102 32L26 52L52 58Z" fill="#ffffff"/>
<path d="M102 32L52 58L46 77Z" fill="#cfe0f5"/>
<path d="M102 32L52 58L60 66Z" fill="#9db9e2"/>
<path d="M102 32L26 52L52 58" stroke="#7fa3d6" stroke-width="1.2" fill="none" stroke-linejoin="round" opacity="0.7"/>
</g>
</svg>
