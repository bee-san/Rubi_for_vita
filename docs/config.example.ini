; Rubi settings. Changes apply the next time the overlay opens.

; Dictionary used for word lookups: local (the files below)
dictionary = local

; Local Yomitan dictionaries: convert on a computer, then copy .vjdict files here.
local_dictionary_dir = ux0:data/VitaJPOverlay/dictionaries
; The bundled word/grammar/kanji and PSP/Vita character-name dictionaries.
; Up to 8 filenames, separated by commas, in priority order.
local_dictionaries = plaintext.vjdict,vndb-names.vjdict
; Dictionaries shown per selected word, 1-8: the best match first, then each
; other dictionary's entry in the order above. L/R tap pages; one is in memory.
local_dictionary_results = 1

; Drop OCR lines without Japanese characters, and lines that are only a text
; box's border read as long vowels and dashes: none | lines
non_japanese_filter = lines

; Left/right character lookup skips Latin text, numbers and punctuation: on | off.
; Select Japanese kana and Han characters; this does not tokenize words.
japanese_only_selection = off

; Highlight the dictionary match or only the cursor character: word | character.
; Word skips the matched source span; character steps one character.
highlight_mode = word

; The left stick moves the cursor through the text, faster while held; the word
; there is looked up once the cursor has rested this long (ms, 0 = as soon as it
; stops). The d-pad and taps look up at once.
stick_lookup_ms = 200

; Show each word's frequency rank after its reading: on | off. #1 is the most
; frequent word; unranked: not in the frequency list its dictionary carries.
frequency_badge = on

; Draw the overlay on the game's own text: the word under the cursor is marked
; where it is on the screen, a tap on the game's text looks a word up, and the
; popup sits beside the word: on | off (docs/overlay-on-text.md)
overlay_on_text = off

; Text size, 8-40: Japanese (sentence, words, readings) and English (meanings, messages)
font_size_ja = 18
font_size_en = 14

; Opens/closes the overlay: a button combination, or a double tap on the rear
; touchpad (buttons are hidden from the game; rear taps are not):
; l+r | select | start | select+l | select+r | rear_double_tap
toggle_button = l+r

; Turns subtitles on/off: the recognized text in a strip at the top of the
; screen while the game runs. Same values as toggle_button, but not the same one.
; When one is part of the other (select and select+r), the shorter one acts
; on release.
subtitle_button = select+r

; Where the text comes from (the Rubi app's Text source), from a game's next start:
; auto (native text hooks in the games that have one, checked against OCR) |
; hooks (as auto, and the game's own text copies in every game that is ON) | ocr
text_source = auto
; Text hooks at table sites (Rubi's and Luna's entries): on | off (off: only
; the string-copy hooks, to tell the two apart in a test)
hook_sites = on

; OCR: vita-vn-ocr, offline on the Vita (docs/vita-vn-ocr.md)
ocr_model_dir = ux0:data/VitaJPOverlay/ocr
; vocr model size (the Rubi app's Model size): small (fastest) | normal
; (the default, balanced) | large (most accurate)
vocr_tier = normal
; vocr: read text once still this long (ms, 0 = off), waiting at most the max,
; or the press max when the open overlay waits
ocr_settle_ms = 150
ocr_settle_max_ms = 2000
ocr_settle_press_ms = 1000
; vocr: skip found lines with no ink (an even area, a smooth gradient): on | off
; (off: it finds next to none at native resolution; see docs/vita-vn-ocr.md)
ocr_skip_blank_lines = off
; vocr: largest LM: 4000k | 2000k | 1000k | 500k | off
ocr_lm = 1000k
; vocr: re-read doubtful lines with the next model size up within (ms, 0 = off)
ocr_cascade_ms = 2000
; vocr: refine lines: psp | on | off
ocr_refine_lines = psp
; vocr: no lines where a text-presence gate sees no text (a hidden text box,
; a CG screen): on | off
ocr_text_gate = off
; vocr: lines read at once (1-3), 444 MHz while reading (on | off: the Rubi
; app's Speed boost while reading)
ocr_threads = 3
ocr_boost_clock = on

; The Rubi app's Read text. auto: recognize text in the background when the
; region settles, so the popup is ready when you press; on_press: recognize only
; when the overlay is opened (docs/auto-vs-press.md)
ocr_mode = auto

; Debugging: write ux0:data/VitaJPOverlay/log.txt (max 1 MB + one rotated file): on | off
log_file = on

; ---- Anki (optional): the Rubi app's Anki page turns it on and exports the cards ----
; on: enter (× or ○, as the Vita's settings assign it) in the overlay saves the
; shown word as a card in a queue on the memory card; the Rubi app exports the
; queue as a Lapis .apkg file for Anki (docs/anki.md). off: enter does nothing.
anki_mining = off
; on: each card keeps a JPEG of the game's screen (about 60 KB) in its Picture
anki_screenshot = on
; on: without the black bars around the game's picture (a PSP game shown smaller
; than the screen, a 4:3 picture): on | off
anki_screenshot_trim_bars = on
