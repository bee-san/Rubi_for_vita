name: Hook request
description: "Ask for a native text hook for a PS Vita game: send the debug build's hooks.log."
title: "Hook request: "
labels: ["hook request"]
body:
  - type: markdown
    attributes:
      value: |
        A native text hook gives Rubi the game's own text instead of OCR's reading of the screen. Rubi has
        game-specific hook entries for the Vita games in
        [its list](https://github.com/bee-san/Rubi_for_vita/blob/main/docs/hook-titles.md#vita-titles); every other game
        is read with OCR. The owner's hook farm turns a request into a verified entry for your game, and what it needs
        from you is one small file, the debug build's `hooks.log`. The whole process:
        [docs/hook-requests.md](https://github.com/bee-san/Rubi_for_vita/blob/main/docs/hook-requests.md).

        **1. Install the debug build.** Only the debug build writes `hooks.log`. Recent releases are the normal build
        only; every test build has the debug one: the newest pre-release on the
        [releases page](https://github.com/bee-san/Rubi_for_vita/releases), file `Rubi-<version>-debug.vpk`
        ([#351](https://github.com/bee-san/Rubi_for_vita/issues/351) says what is in it). Close the Rubi app if it is
        open, install the VPK with VitaShell, open Rubi, choose **Update** on its Install page, then restart the Vita.
        Your settings, games and cards stay.

        **2. Check two settings in the Rubi app.** The game is **ON** on the **Games** page, and **OCR & lookup →
        Text source** is **Automatic**. With **OCR only**, no `hooks.log` is written.

        **3. Start the game** and play until its first dialogue is on screen, then close it.

        **4. Copy `ux0:data/VitaJPOverlay/hooks.log`** before you start another game: each game's start rewrites it
        (VitaShell and the Rubi app do not). Any of these works:
        - VitaShell's USB connection: the file is `data/VitaJPOverlay/hooks.log` on the memory card's drive.
        - VitaShell's FTP connection: `curl -o hooks.log ftp://VITA_IP:1337/ux0:/data/VitaJPOverlay/hooks.log`, or any
          FTP client, in `ux0:/data/VitaJPOverlay/`.
        - From a computer, in the extracted `Rubi-<version>-debug.zip`: `bash tools/install_ftp.sh --collect VITA_IP`
          fetches it with the other logs and writes `hook-request.md` beside them.

        `hooks.log` holds no game text: only the game's title ID, version, module name and NID, and the code bytes
        at each hook site Rubi tried. Never attach the game or any of its files.
  - type: input
    id: game
    attributes:
      label: Game
      description: "Its title, as on its LiveArea, and its VNDB page if you know it."
      placeholder: "ALIA's CARNIVAL! サクラメント, https://vndb.org/v..."
    validations:
      required: true
  - type: input
    id: title-id
    attributes:
      label: Title ID
      description: "Nine characters: the first word of hooks.log, also on the Rubi app's Games page."
      placeholder: "PCSG00628"
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Game version
      description: "Optional: APP_VER, such as 01.00, and whether an update is installed. hooks.log records it too."
      placeholder: "01.00"
  - type: input
    id: rubi-version
    attributes:
      label: Rubi version
      description: "As the Rubi app shows it beside its title: the debug build says debug."
      placeholder: "Rubi v0.9.8-test.2 debug"
    validations:
      required: true
  - type: dropdown
    id: text-now
    attributes:
      label: What the popup shows in this game now
      options:
        - "OCR's reading: no hook text"
        - "A hook's text, but it is wrong or incomplete"
        - "I can't tell"
    validations:
      required: true
  - type: textarea
    id: hooks-log
    attributes:
      label: hooks.log
      description: "Paste the whole file, copied right after you played this game."
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Optional: your console (PCH-1000, PCH-2000, PS TV) and firmware, what the popup shows, or the --collect zip
        (drag it here). The debug build's log.txt and the zip's Anki queue hold the text Rubi read and your cards:
        attach them only if you are happy to share them.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: "I looked for an open hook request for this title ID first."
          required: true
        - label: "The hooks.log is from the debug build, with Text source on Automatic, copied after I played this game."
          required: true
