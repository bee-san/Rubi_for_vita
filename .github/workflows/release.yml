name: Release
# Test changes in the fork; publishing still requires an explicit v* tag.
#
# Cost (GitHub Actions audit, 2026-10-13): 163 runs / ~760 minutes in 30 days, every job every
# time. Superseded runs of a pull request are now cancelled, draft pull requests wait until they
# are marked ready, and a change that only touches Markdown skips the builds (the `changes` job
# still reports, so `gh pr checks` has a result). Tag pushes and manual runs build everything.
# A pull request from a fork gets no secrets: it skips the private dictionary and what needs it
# (the release zip, the tests on the dictionary) and runs everything else (`changes`' `dicts`).
#
# Speed (2026-10-26, owner: "ci for rubi is too slow"): a run took 7-12 minutes, and the host jobs were
# cancelled at their limit whenever the runner's Ubuntu mirror was slow (the ARM toolchain's 61.3 MB). Now
# the apt packages and the Vita toolchain come from actions/cache (tools/ci_apt_cache.sh,
# tools/ci_toolchain_cache.sh), ctest runs in parallel with the tools' Python suites one test per module,
# the ARM lane is one job for both builds, the normal build's host job leaves the suites that never read
# the build to the debug build's, and tools/ci_scope.py decides what a pull request needs: Markdown alone
# builds nothing, the hooks' verified-entry table alone (core/hook_place.c) leaves out the tools' Python
# suites, and only a change to the package's files (or to CI) makes the release zips and runs the package
# e2e. Pushes (main, test branches), tags and manual runs still run all of it. The merge gate is local:
# tools/fast_gate.sh (AGENTS.md).
#
# Two builds (docs/release-variants.md): the host and vita jobs run once for each, VJO_DEBUG=ON (the
# debug build, the test builds' own) and OFF (the normal build, the release's main download), and the
# arm job runs both. The debug build's zip is the artifact `Rubi` (exactly one zip in it; `VitaJPOverlay`
# before the rename); the normal build's is `Rubi-normal`. tools/package_variants.py makes the release's
# two zips of them; the `package` job does so and checks each with tools/e2e_package.py.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: what changed
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      hooks_only: ${{ steps.diff.outputs.hooks_only }}
      packaging: ${{ steps.diff.outputs.packaging }}
      dicts: ${{ steps.dicts.outputs.dicts }}
    steps:
      - uses: actions/checkout@v4
      - id: diff
        name: What does the change need? (tools/ci_scope.py)
        env:
          # Base branch tip for a pull request, previous tip for a push; empty or all zeros (tag, new
          # branch, manual run) means "build everything".
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
        run: |
          full=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && [ "$REF_TYPE" != "tag" ]; then
            if git fetch --no-tags --depth=1 origin "$BASE"; then
              changed=$(git diff --name-only "$BASE" HEAD)
              printf '%s\n' "$changed" | sed 's/^/  /'
              printf '%s\n' "$changed" | python3 tools/ci_scope.py > scope.txt
              full=false
            else
              echo "::warning::could not fetch $BASE; building everything"
            fi
          fi
          if [ "$full" = true ]; then
            printf 'code=true\nhooks_only=false\npackaging=true\n' > scope.txt
          elif [ "$EVENT" != pull_request ]; then
            # A push (main, a test branch): its zips are what test builds and releases are made of, so
            # anything but Markdown runs all of it.
            code=$(sed -n 's/^code=//p' scope.txt)
            printf 'code=%s\nhooks_only=false\npackaging=%s\n' "$code" "$code" > scope.txt
          fi
          tee -a "$GITHUB_OUTPUT" < scope.txt
          if grep -qx 'code=false' scope.txt; then
            echo "::notice title=builds skipped::only Markdown changed"
          elif grep -qx 'hooks_only=true' scope.txt; then
            echo "::notice title=hook table only::only the hooks' verified-entry table (core/hook_place.c) changed: the host jobs leave out the tools' Python suites; the C suites, the ARM lane and the Vita builds run"
          fi
          if grep -qx 'code=true' scope.txt && grep -qx 'packaging=false' scope.txt; then
            echo "::notice title=no package e2e::no file of the package changed (tools/ci_scope.py): the release zips, their artifacts and tools/e2e_package.py are left out"
          fi
      - id: dicts
        name: Can this run read the private dictionaries?
        env:
          # A pull request from a fork gets no secrets, so it cannot check out the private
          # bee-san/plaintext-dicts: it skips the dictionary's checkout, the tests on it and the
          # release zip, and runs everything else. Every other run (main, tags, manual runs,
          # this repository's own branches) still needs the dictionary and fails without it.
          # The jobs skip only on `dicts == 'false'`: a missing output (say, a renamed step)
          # takes the dictionary path and fails loudly where there is no key, never skips.
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          HAVE_KEY: ${{ secrets.PLAINTEXT_DICTS_SOURCE_KEY != '' }}
        run: |
          dicts=true
          if [ "$FORK" = true ] && [ "$HAVE_KEY" != true ]; then
            dicts=false
            echo "::notice title=private dictionary skipped::a pull request from a fork gets no secrets: the frozen dictionary, the tests on it and the release zip are skipped; everything else runs"
          fi
          echo "dicts=$dicts" >> "$GITHUB_OUTPUT"
          echo "dicts=$dicts"

  host:
    name: host (${{ matrix.variant }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    # About 3 minutes (2026-10-26); 15 leaves room for a cache miss's apt download.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug
            debug: 'ON'
          - variant: normal
            debug: 'OFF'
    steps:
      - uses: actions/checkout@v4
      # the pinned OCR runtime, the text spotter's and the frozen dictionaries (.github/actions/pinned-sources);
      # without the dictionaries (a fork's pull request) CMake leaves out plaintext_dictionary and word_lookup
      # reports itself skipped; every other test runs
      - uses: ./.github/actions/pinned-sources
        with:
          vocr-key: ${{ secrets.VOCR_SOURCE_KEY }}
          dictionaries: ${{ needs.changes.outputs.dicts != 'false' }}
          dicts-key: ${{ secrets.PLAINTEXT_DICTS_SOURCE_KEY }}
      # The .deb files of the packages below, kept by actions/cache (saved as soon as they are installed,
      # whatever the tests then do); bump the key's -vN when the list changes.
      - id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: .refs/apt-host
          key: apt-host-ubuntu-24.04-ninja-pil-v5
      - run: bash tools/ci_apt_cache.sh .refs/apt-host ninja-build python3-pil
      - if: ${{ steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .refs/apt-host
          key: apt-host-ubuntu-24.04-ninja-pil-v5
      - run: cmake -S . -B build/host -G Ninja -DVJO_DEBUG=${{ matrix.debug }} -DVJO_VOCR_SOURCE_DIR=$PWD/.refs/vita-vn-ocr -DVJO_VOCR_SPOT_SOURCE_DIR=$PWD/.refs/vita-vn-ocr-spot && cmake --build build/host "-j$(nproc)"
      # Anki itself imports the Rubi app's .apkg packages (host/tests/test_apkg.py): the anki
      # package (Anki 26.09.3), hash-pinned for Python 3.12, in a venv of its own. This Python is
      # not put on PATH, so CMake's Python and the image tests' Pillow stay the system's.
      - name: Python 3.12 for the Anki import (not on PATH)
        id: anki-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          update-environment: false
      - name: The pinned anki package
        run: |
          "${{ steps.anki-python.outputs.python-path }}" -m venv .venv-anki
          .venv-anki/bin/pip install --require-hashes --only-binary=:all: -r tools/requirements-anki.txt
      # VJO_REQUIRE_ANKI: the import tests fail, not skip, if the anki package cannot be imported.
      # -j twice the processors: the tools' Python suites (one test per module, tools_*, the slowest first)
      # spend much of their time waiting on the programs and the FTP mock they run. The normal build leaves
      # the suites that never read the build (label variant_free) to the debug build's job; a change to the
      # hooks' verified-entry table alone leaves out the tools' suites whose programs do not read it (label
      # tools: all but tools_hook_request and tools_hook_farm).
      - name: ctest (parallel)
        run: ctest --test-dir build/host -j$(( $(nproc) * 2 )) --output-on-failure $SELECT
        env:
          VJO_ANKI_PYTHON: ${{ github.workspace }}/.venv-anki/bin/python
          VJO_REQUIRE_ANKI: '1'
          SELECT: ${{ needs.changes.outputs.hooks_only == 'true' && '-LE tools' || (matrix.variant == 'normal' && '-LE variant_free' || '') }}
      # What Anki imported, in the log (ctest shows a passing test's output only with -V); the
      # step fails unless the import line is there.
      - name: The packages Anki imported
        shell: bash
        run: |
          ctest --test-dir build/host -R '^apkg_packages$' -V > apkg-import.log 2>&1 || { cat apkg-import.log; exit 1; }
          grep -E '^[0-9]+: (anki [0-9.]+:|Ran |OK)' apkg-import.log
          grep -qE '^[0-9]+: anki [0-9.]+: [0-9]+ \+ [0-9]+ \+ [0-9]+ notes imported' apkg-import.log
        env:
          VJO_ANKI_PYTHON: ${{ github.workspace }}/.venv-anki/bin/python
          VJO_REQUIRE_ANKI: '1'

  # The pure-C kernel and core suites on the Vita's CPU (32-bit ARMv7, Cortex-A9) under qemu-arm, both
  # builds: 32-bit width and atomics bugs the x86_64 suites cannot see (docs/offline-testing.md). Its own
  # job (until 2026-10-26 the host jobs' last steps): one cached toolchain install for both builds, and
  # the host jobs no longer wait for it.
  arm:
    name: arm (both builds)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    # 25 (#297): on a cache miss the toolchain's 61.3 MB comes from the runner's Azure Ubuntu mirror, which
    # gave about 120 kB/s on 2026-10-26 (8.5 minutes); from the cache the job takes about 2.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # the pinned OCR runtime, the text spotter's and the frozen dictionaries (.github/actions/pinned-sources)
      - uses: ./.github/actions/pinned-sources
        with:
          vocr-key: ${{ secrets.VOCR_SOURCE_KEY }}
          dictionaries: ${{ needs.changes.outputs.dicts != 'false' }}
          dicts-key: ${{ secrets.PLAINTEXT_DICTS_SOURCE_KEY }}
      # GCC 14: the pinned vita-vn-ocr runtime's NEON kernels (#85) use vld1q_*_x2, which GCC's
      # 32-bit ARM arm_neon.h has from GCC 14 on; Ubuntu 24.04's default cross gcc is 13.
      - id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: .refs/apt-arm
          key: apt-arm-ubuntu-24.04-gcc14-armhf-qemu-v3
      - name: The ARM toolchain and qemu-arm (cached .debs; the mirror only on a miss)
        run: bash tools/ci_apt_cache.sh .refs/apt-arm gcc-14-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user-static
      - if: ${{ steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .refs/apt-arm
          key: apt-arm-ubuntu-24.04-gcc14-armhf-qemu-v3
      # VJO_PLAINTEXT_DIR: the frozen dictionary, unpacked and checked against its pins; the lookup must
      # give the same results on ARM. Without the dictionary only that lookup comparison is left out.
      - name: The frozen dictionary, unpacked
        if: ${{ needs.changes.outputs.dicts != 'false' }}
        run: python3 tools/prepare_plaintext.py --source .refs/plaintext-dicts -o build/plaintext/plaintext.vjdict
      - name: The debug build's suites on the A9
        env:
          DICTS: ${{ needs.changes.outputs.dicts }}
        run: |
          if [ "$DICTS" != false ]; then export VJO_PLAINTEXT_DIR=$PWD/build/plaintext; else echo "::notice title=arm word_lookup skipped::no private dictionary in this run"; fi
          VJO_DEBUG=1 ARM_CC=arm-linux-gnueabihf-gcc-14 QEMU=qemu-arm-static VJO_VOCR_SOURCE_DIR=$PWD/.refs/vita-vn-ocr VJO_VOCR_SPOT_SOURCE_DIR=$PWD/.refs/vita-vn-ocr-spot bash tools/arm_host_tests.sh build/arm-debug
      - name: The normal build's suites on the A9
        if: ${{ !cancelled() }}
        env:
          DICTS: ${{ needs.changes.outputs.dicts }}
        run: |
          if [ "$DICTS" != false ]; then export VJO_PLAINTEXT_DIR=$PWD/build/plaintext; fi
          VJO_DEBUG=0 ARM_CC=arm-linux-gnueabihf-gcc-14 QEMU=qemu-arm-static VJO_VOCR_SOURCE_DIR=$PWD/.refs/vita-vn-ocr VJO_VOCR_SPOT_SOURCE_DIR=$PWD/.refs/vita-vn-ocr-spot bash tools/arm_host_tests.sh build/arm-normal

  vita:
    name: vita (${{ matrix.variant }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # vitasdk/vitasdk:2026.08 by digest: the image every release from v0.9.2 to v0.9.7 was built in (each
    # Release run's "Initialize containers" step: "Digest: sha256:8227da1b..."). The Rubi app's eboot.bin
    # links the SDK's libraries, so a moved tag changed it without a commit here; now a new SDK is a change
    # to this line (and to tools/ci_container_build.sh and tools/gate/vita.Dockerfile, which pin the same).
    container: vitasdk/vitasdk@sha256:8227da1b596d981f4513cd9b36bda1e43857f6dae5bcf4312c1cd40167f7d9bb
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug
            debug: 'ON'
            artifact: Rubi
          - variant: normal
            debug: 'OFF'
            artifact: Rubi-normal
    steps:
      - uses: actions/checkout@v4
      # openssh-client for the private checkouts (the image has the rest of the list); the .debs cached.
      - id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: .refs/apt-vita
          key: apt-vita-8227da1b-ssh-v3
      - run: bash tools/ci_apt_cache.sh .refs/apt-vita g++ patch python3 openssh-client
      - if: ${{ steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .refs/apt-vita
          key: apt-vita-8227da1b-ssh-v3
      # the pinned OCR runtime, the text spotter's and the frozen dictionaries (.github/actions/pinned-sources);
      # the dictionaries only for the release zip
      - uses: ./.github/actions/pinned-sources
        with:
          vocr-key: ${{ secrets.VOCR_SOURCE_KEY }}
          dictionaries: ${{ needs.changes.outputs.dicts != 'false' && needs.changes.outputs.packaging == 'true' }}
          dicts-key: ${{ secrets.PLAINTEXT_DICTS_SOURCE_KEY }}
      # tools/setup_toolchain.sh's result (what it adds to the image's SDK, psp2cxml-tool, the app's pinned
      # packages), kept for this image and these scripts; restored, the script runs again and finds every
      # step done (tools/ci_toolchain_cache.sh). It took 70-100 s of every vita job.
      - id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: .refs/toolchain-cache
          key: vita-toolchain-8227da1b-${{ hashFiles('tools/setup_toolchain.sh', 'tools/setup_settings_deps.py', 'tools/ci_toolchain_cache.sh') }}
      - run: WORK=$PWD/.refs/toolchain bash tools/ci_toolchain_cache.sh .refs/toolchain-cache
      - if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .refs/toolchain-cache
          key: vita-toolchain-8227da1b-${{ hashFiles('tools/setup_toolchain.sh', 'tools/setup_settings_deps.py', 'tools/ci_toolchain_cache.sh') }}
      # The build runs every check (kernel instructions, syscall ABI, memory ledger, offline imports, the
      # modules' variant, the Rubi app's SELF, PNG ABI and artwork); only the release zip needs the dictionary.
      - run: |
          export PATH=$PWD/.refs/toolchain/psp2cxml-tool/mbuild:$PATH
          cmake -S vita -B build/vita -DCMAKE_BUILD_TYPE=Release -DVJO_DEBUG=${{ matrix.debug }} -DVJO_VOCR_SOURCE_DIR=$PWD/.refs/vita-vn-ocr -DVJO_VOCR_SPOT_SOURCE_DIR=$PWD/.refs/vita-vn-ocr-spot && cmake --build build/vita "-j$(nproc)"
      # The zip, for the package job and the artifact: on pushes, tags and manual runs, and for a pull
      # request that changes the package's files (tools/ci_scope.py).
      - name: Package the release zip (with the frozen dictionary)
        if: ${{ needs.changes.outputs.dicts != 'false' && needs.changes.outputs.packaging == 'true' }}
        run: |
          export PATH=$PWD/.refs/toolchain/psp2cxml-tool/mbuild:$PATH
          cmake --build build/vita --target release
      # The build's module rows and its variant check, in the job's summary
      - name: The ${{ matrix.variant }} build's modules
        shell: bash
        run: |
          {
            echo "### the ${{ matrix.variant }} build"
            echo '```'
            python3 tools/check_memory_ledger.py --variant ${{ matrix.variant }} --kernel build/vita/VitaJPOverlay_Kernel.skprx \
              --shell build/vita/VitaJPOverlay_Shell.suprx --worker build/vita/VitaJPOverlay_OCR.suprx | grep -E 'VitaJPOverlay_|memory ledger'
            ls -l build/vita/*.skprx build/vita/*.suprx build/vita/eboot.bin build/vita/Rubi.vpk | awk '{print $5, $NF}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ needs.changes.outputs.dicts != 'false' && needs.changes.outputs.packaging == 'true' }}
        with:
          name: ${{ matrix.artifact }}
          path: build/vita/Rubi-*.zip
          # A pull request's build is only needed while it is reviewed and audited (7 days); a
          # build of main, a tag or a manual run is what test packages are made from (30 days).
          # Published releases keep their own assets. The default would be 90 days, and a build
          # was about 43 MB on 2026-10-14.
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  # The release's two zips, made of the two vita jobs' artifacts as the final release makes them
  # (docs/release-variants.md: tools/package_variants.py with the pinned models and LMs, no --set),
  # and each run through tools/e2e_package.py: the package's own install-vita.sh and install_ftp.sh
  # against a simulated Vita (docs/offline-testing.md). The models come from vita-vn-ocr's public
  # releases, checked against tools/prepare_ocr.py's pins: no secret is needed for them. Without the
  # dictionary (a fork's pull request) there is no release zip, so there is nothing to package; nor for a
  # pull request that changes none of the package's files (tools/ci_scope.py).
  package:
    name: package e2e (both builds)
    needs: [changes, vita]
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.dicts != 'false' && needs.changes.outputs.packaging == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Rubi
          path: ci/debug
      - uses: actions/download-artifact@v4
        with:
          name: Rubi-normal
          path: ci/normal
      # A cached copy is used only after prepare_ocr.py checks it against the pins (a wrong or partial file
      # is fetched again), and the key changes with the pins and the model sizes. A run's conclusion
      # includes this job, and test builds take only a successful run, so a download failure is retried
      # before it fails the run.
      - name: The pinned models' cache
        uses: actions/cache@v4
        with:
          path: ci/models
          key: vjo-models-${{ hashFiles('tools/prepare_ocr.py', 'tools/model_tiers.json', 'include/vjo_vocr_sizes.h') }}
      - name: The pinned models and LMs
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python3 tools/prepare_ocr.py --backend vocr-tiers --output ci/models &&
               python3 tools/prepare_ocr.py --backend vocr-lm --output ci/models; then
              exit 0
            fi
            echo "::warning::the pinned models' download failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          exit 1
      - name: The release's two zips (tools/package_variants.py)
        shell: bash
        run: |
          normal=(ci/normal/Rubi-*.zip)
          debug=(ci/debug/Rubi-*-debug.zip)
          [ ${#normal[@]} = 1 ] && [ -f "${normal[0]}" ] && [ ${#debug[@]} = 1 ] && [ -f "${debug[0]}" ] \
            || { echo "::error::want one zip in each artifact: ${normal[*]} / ${debug[*]}"; exit 1; }
          version=$(basename "${normal[0]}" .zip)
          version=${version#Rubi-}
          python3 tools/package_variants.py --normal "${normal[0]}" --debug "${debug[0]}" --models ci/models \
            --version "$version" --source-revision "$(git rev-parse HEAD)" --sources . -o ci/release
      # Both packages at once, each in its own work directory (build/e2e-package/<zip>); their logs in order.
      - name: tools/e2e_package.py on each zip
        shell: bash
        run: |
          pids=()
          for zip in ci/release/Rubi-*.zip; do
            python3 tools/e2e_package.py "$zip" > "ci/$(basename "$zip" .zip).e2e.log" 2>&1 &
            pids+=($!)
          done
          rc=0
          for pid in "${pids[@]}"; do wait "$pid" || rc=1; done
          for log in ci/*.e2e.log; do
            echo "::group::$(basename "$log" .e2e.log)"
            cat "$log"
            echo "::endgroup::"
          done
          exit $rc
      # The scenarios' logs (the installs' and --collect's output)
      - name: The e2e logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-package-logs
          path: build/e2e-package/*/*.log
          if-no-files-found: ignore
          retention-days: 7

# A release is published explicitly after these gates. tools/package_variants.py (tools/package_release.py
# for each build) combines the two builds' binaries with checksum-pinned models and the frozen
# bundled dictionary (Bee's Ultimate Dictionary): Rubi-<version>.zip (normal) and -debug.zip, and each
# build's one-VPK install, Rubi-<version>.vpk and -debug.vpk (tools/package_vpk.py,
# docs/one-vpk-install.md). CI never publishes an incomplete archive lacking local OCR/dictionary data.
