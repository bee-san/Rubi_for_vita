name: Release
# Test changes in the fork; publishing still requires an explicit v* tag.
#
# Cost (GitHub Actions audit, 2026-10-13): 163 runs / ~760 minutes in 30 days, every job every
# time. Superseded runs of a pull request are now cancelled, draft pull requests wait until they
# are marked ready, and a change that only touches Markdown skips the builds (the `changes` job
# still reports, so `gh pr checks` has a result). Tag pushes and manual runs build everything.
# A pull request from a fork gets no secrets: it skips the private dictionary and what needs it
# (the release zip, the tests on the dictionary) and runs everything else (`changes`' `dicts`).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: what changed
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      dicts: ${{ steps.dicts.outputs.dicts }}
    steps:
      - uses: actions/checkout@v4
      - id: diff
        name: Does anything but Markdown change?
        env:
          # Base branch tip for a pull request, previous tip for a push to main; empty or all
          # zeros (tag, new branch, manual run) means "build everything".
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          code=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && [ "$REF_TYPE" != "tag" ]; then
            if git fetch --no-tags --depth=1 origin "$BASE"; then
              changed=$(git diff --name-only "$BASE" HEAD)
              printf '%s\n' "$changed" | sed 's/^/  /'
              if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '\.md$'; then
                code=false
                echo "::notice title=builds skipped::only Markdown changed"
              fi
            else
              echo "::warning::could not fetch $BASE; building everything"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"
      - id: dicts
        name: Can this run read the private dictionaries?
        env:
          # A pull request from a fork gets no secrets, so it cannot check out the private
          # bee-san/plaintext-dicts: it skips the dictionary's checkout, the tests on it and the
          # release zip, and runs everything else. Every other run (main, tags, manual runs,
          # this repository's own branches) still needs the dictionary and fails without it.
          # The jobs skip only on `dicts == 'false'`: a missing output (say, a renamed step)
          # takes the dictionary path and fails loudly where there is no key, never skips.
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          HAVE_KEY: ${{ secrets.PLAINTEXT_DICTS_SOURCE_KEY != '' }}
        run: |
          dicts=true
          if [ "$FORK" = true ] && [ "$HAVE_KEY" != true ]; then
            dicts=false
            echo "::notice title=private dictionary skipped::a pull request from a fork gets no secrets: the frozen dictionary, the tests on it and the release zip are skipped; everything else runs"
          fi
          echo "dicts=$dicts" >> "$GITHUB_OUTPUT"
          echo "dicts=$dicts"

  host:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned private OCR runtime
        uses: actions/checkout@v4
        with:
          repository: bee-san/vita-vn-ocr
          # cmake/VocrOCR.cmake VJO_VOCR_COMMIT (the faster W8I kernels' merge, vita-vn-ocr #85, after #83 and #82)
          ref: d214a05deeef503a5e1d1853fe9fa4c91eb60bc2
          ssh-key: ${{ secrets.VOCR_SOURCE_KEY }}
          persist-credentials: false
          path: .refs/vita-vn-ocr
      # Without it (a fork's pull request) CMake leaves out plaintext_dictionary and word_lookup
      # reports itself skipped; every other test runs.
      - name: Check out the frozen private dictionaries
        if: ${{ needs.changes.outputs.dicts != 'false' }}
        uses: actions/checkout@v4
        with:
          repository: bee-san/plaintext-dicts
          ref: 8d3d80ace15001500e88709c4981baf664732de4
          ssh-key: ${{ secrets.PLAINTEXT_DICTS_SOURCE_KEY }}
          persist-credentials: false
          path: .refs/plaintext-dicts
          sparse-checkout: processed
      - run: sudo apt-get update && sudo apt-get install -y ninja-build python3-pil
      - run: cmake -S . -B build/host -G Ninja -DVJO_VOCR_SOURCE_DIR=$PWD/.refs/vita-vn-ocr && cmake --build build/host -j4
      - run: ctest --test-dir build/host --output-on-failure
      - run: python3 tools/test_jpegsw.py
      # The pure-C kernel and core suites on the Vita's CPU (32-bit ARMv7, Cortex-A9) under
      # qemu-arm: 32-bit width and atomics bugs the x86_64 suites cannot see (docs/offline-testing.md).
      # GCC 14: the pinned vita-vn-ocr runtime's NEON kernels (#85) use vld1q_*_x2, which GCC's
      # 32-bit ARM arm_neon.h has from GCC 14 on; Ubuntu 24.04's default cross gcc is 13.
      - run: sudo apt-get install -y --no-install-recommends gcc-14-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user-static
      # VJO_PLAINTEXT_DIR: the dictionary ctest unpacked; the lookup must give the same results on ARM.
      # Without the dictionary only that lookup comparison is left out.
      - env:
          DICTS: ${{ needs.changes.outputs.dicts }}
        run: |
          if [ "$DICTS" != false ]; then
            export VJO_PLAINTEXT_DIR=$PWD/build/host/plaintext
          else
            echo "::notice title=arm word_lookup skipped::no private dictionary in this run"
          fi
          ARM_CC=arm-linux-gnueabihf-gcc-14 QEMU=qemu-arm-static VJO_VOCR_SOURCE_DIR=$PWD/.refs/vita-vn-ocr bash tools/arm_host_tests.sh build/arm-tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out the compatible Hachidori relay test server
        uses: actions/checkout@v4
        with:
          repository: bee-san/hachidori-anki
          # v0.0.5, pinned so the HTTP contract test cannot drift.
          ref: beffaca1cab2584608a25c276d81b17b0f27088f
          path: .refs/hachidori-anki
      - name: Test the CLI through the real relay HTTP API
        run: node --test tools/test_hachidori_relay.mjs

  vita:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends g++ patch python3 openssh-client
      - name: Check out the pinned private OCR runtime
        uses: actions/checkout@v4
        with:
          repository: bee-san/vita-vn-ocr
          # cmake/VocrOCR.cmake VJO_VOCR_COMMIT (the faster W8I kernels' merge, vita-vn-ocr #85, after #83 and #82)
          ref: d214a05deeef503a5e1d1853fe9fa4c91eb60bc2
          ssh-key: ${{ secrets.VOCR_SOURCE_KEY }}
          persist-credentials: false
          path: .refs/vita-vn-ocr
      - name: Check out the frozen private dictionaries
        if: ${{ needs.changes.outputs.dicts != 'false' }}
        uses: actions/checkout@v4
        with:
          repository: bee-san/plaintext-dicts
          ref: 8d3d80ace15001500e88709c4981baf664732de4
          ssh-key: ${{ secrets.PLAINTEXT_DICTS_SOURCE_KEY }}
          persist-credentials: false
          path: .refs/plaintext-dicts
          sparse-checkout: processed
      - run: WORK=$PWD/.refs/toolchain bash tools/setup_toolchain.sh
      # The build runs every check (kernel instructions, syscall ABI, memory ledger, the Overlay
      # app's PNG ABI and artwork); only the release zip needs the dictionary.
      - run: |
          export PATH=$PWD/.refs/toolchain/psp2cxml-tool/mbuild:$PATH
          cmake -S vita -B build/vita -DCMAKE_BUILD_TYPE=Release -DVJO_VOCR_SOURCE_DIR=$PWD/.refs/vita-vn-ocr && cmake --build build/vita -j4
      - name: Package the release zip (with the frozen dictionary)
        if: ${{ needs.changes.outputs.dicts != 'false' }}
        run: |
          export PATH=$PWD/.refs/toolchain/psp2cxml-tool/mbuild:$PATH
          cmake --build build/vita --target release
      - uses: actions/upload-artifact@v4
        if: ${{ needs.changes.outputs.dicts != 'false' }}
        with:
          name: VitaJPOverlay
          path: build/vita/VitaJPOverlay-*.zip
          # A pull request's build is only needed while it is reviewed and audited (7 days); a
          # build of main, a tag or a manual run is what test packages are made from (30 days).
          # Published releases keep their own assets. The default would be 90 days, and a build
          # was about 43 MB on 2026-10-14.
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

# A release is published explicitly after these gates. tools/package_release.py
# combines the built binaries with checksum-pinned models and the frozen Daijirin4 -> Sankoku8 -> JMdict bundle.
# CI never publishes an incomplete archive lacking local OCR/dictionary data.
